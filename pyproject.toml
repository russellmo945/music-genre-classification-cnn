[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-genre-classification-cnn"
version = "0.1.0"
description = "A documented GTZAN CNN experiment with track-disjoint training and evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "torch>=2.6,<3", "scikit-learn>=1.4,<2", "pandas>=2.2,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
audio = ["librosa>=0.10.2,<0.12", "soundfile>=0.12,<1"]
notebook = ["jupyterlab>=4,<5"]

[project.scripts]
music-genre = "music_genre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
